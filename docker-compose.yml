# 一容器一场婚礼。多场使用不同项目名、端口、域名和 NAS_DATA_DIR。
services:
  wedding-collect:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: wedding-collect:web
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-1240}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: "3000"
      DATA_ROOT: /data
      # 默认允许局域网访问，不能相信任意来源的代理头。
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      THUMB_CONCURRENCY: "1"
      TRANSCODE_ENABLED: "false"
      REMUX_ENABLED: "false"
    volumes:
      # SQLite、原图、缩略图、分片必须在同一个本地文件系统。
      - "${NAS_DATA_DIR:-/vol1/1000/photos/wedding-collect}:/data"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      test: ["CMD", "node", "server/scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
